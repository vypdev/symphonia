name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check specification consistency
        run: PYTHONPATH=. python tools/validate_specs.py
      - name: Check patch whitespace
        env:
          PATCH_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$PATCH_BASE" =~ ^0+$ ]]; then
            DEFAULT_REF="refs/remotes/origin/$DEFAULT_BRANCH"
            if git show-ref --verify --quiet "$DEFAULT_REF"; then
              if PATCH_BASE="$(git merge-base HEAD "$DEFAULT_REF")"; then
                git diff --check "${PATCH_BASE}...HEAD"
                exit 0
              fi
            fi
            EMPTY_TREE="$(git hash-object -t tree /dev/null)"
            git diff --check "$EMPTY_TREE" HEAD
          else
            git diff --check "${PATCH_BASE}...HEAD"
          fi
      - name: Run offline test suite
        run: PYTHONPATH=src:. python -m unittest discover -s tests -v

  ui-lit-spike:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs/development/ui-lit-spike
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/development/ui-lit-spike/package-lock.json
      - name: Install pinned spike dependencies
        run: npm ci --ignore-scripts
      - name: Check types
        run: npm run check
      - name: Check presentation boundary
        run: npm run check-boundary
      - name: Run pure fallback tests
        run: npm test
      - name: Build isolated UI spike
        run: npm run build
      - name: Inspect relative assets
        run: npm run verify-output

  operational-ui:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install pinned production UI dependencies
        run: npm ci --ignore-scripts
      - name: Check types
        run: npm run check
      - name: Test UI state transitions
        run: npm test
      - name: Build App UI
        run: npm run build
      - name: Check committed App assets are reproducible
        run: git diff --exit-code -- ../src/symphonia/runtime/ui_assets

  branch-coverage:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pinned quality tool
        run: python -m pip install coverage==7.16.1
      - name: Measure line and branch coverage
        run: |
          PYTHONPATH=src:. python -m coverage run -m unittest discover -s tests -q
          python -m coverage report --sort=cover

  playback-lab-config:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs/development/playback-lab
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate disposable lab configuration without starting services
        run: docker compose --env-file .env.example -f compose.yaml config --quiet
